
version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-southeast-2"
    AWS_ACCOUNT_ID: "685323281079"
    IMAGE_REPO_NAME: "akash/spring-eks"

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - export FULL_COMMIT_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - export SHORT_COMMIT_SHA="${FULL_COMMIT_SHA:0:7}"
      - export REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - export IMAGE_URI="$REGISTRY/$IMAGE_REPO_NAME"

  build:
    commands:
      - echo "Running Maven tests..."
      - mvn test
      - echo "Packaging Spring Boot application..."
      - mvn package -DskipTests
      - echo "Building AMD64 Docker image..."
      - docker build --platform linux/amd64 -t "$IMAGE_URI:$FULL_COMMIT_SHA" -t "$IMAGE_URI:$SHORT_COMMIT_SHA" .
      - echo "Built image tags $SHORT_COMMIT_SHA and $FULL_COMMIT_SHA"

  post_build:
    commands:
      - echo "Pushing commit-SHA image tags to ECR..."
      - docker push "$IMAGE_URI:$FULL_COMMIT_SHA"
      - docker push "$IMAGE_URI:$SHORT_COMMIT_SHA"
      - echo "Image published successfully."
