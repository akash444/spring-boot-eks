apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: spring-eks-lab
  region: ap-southeast-2

vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: false
  publicAccessCIDRs:
    - "49.37.113.255/32"

managedNodeGroups:
  - name: spring-eks-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    privateNetworking: false
